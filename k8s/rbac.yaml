apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: active-fed

---
# Allows pipeline pods to manage PyTorchJobs + Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: active-fed-pipeline-role
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs"]
    verbs: ["get", "list", "create", "delete", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # nodes: required by _resolve_host_node_ip (src/orchestration/activities.py)
  # under topology='multi'. Worker Jobs run on member clusters that cannot
  # resolve the host's *.svc.cluster.local names, so their MinIO/MLflow
  # endpoints are rewritten to <host-node-InternalIP>:<NodePort>, and that IP
  # is read from the host cluster's node list at dispatch time rather than
  # configured -- a kind node's Docker IP changes across a host restart, so a
  # written-down value silently points at the wrong container. Read-only, and
  # unused by topology='single'.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: active-fed-pipeline-binding
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: active-fed
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: kubeflow
roleRef:
  kind: ClusterRole
  name: active-fed-pipeline-role
  apiGroup: rbac.authorization.k8s.io
