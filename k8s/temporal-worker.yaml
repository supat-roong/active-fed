apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-worker
  namespace: active-fed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: active-fed-temporal-worker
subjects:
  - kind: ServiceAccount
    name: temporal-worker
    namespace: active-fed
roleRef:
  kind: ClusterRole
  name: active-fed-pipeline-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: active-fed
  labels:
    app: temporal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
    spec:
      serviceAccountName: temporal-worker
      containers:
        - name: worker
          image: active-fed-aggregator:v1
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "python", "-m", "src.orchestration.worker_main"]
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal-frontend.active-fed.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
