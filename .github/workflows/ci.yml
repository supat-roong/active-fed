name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# A superseded run tells you nothing; cancel it and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/fed-infra is a submodule; the contracts job below cannot
          # run without it, and a missing submodule fails in a confusing way
          # (a bare "No such file" from a path that exists locally).
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make install-dev
      - run: make ci

  contracts:
    name: Contract dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Dry-run every contract against the pinned fed-infra
        run: make contracts

  images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: active-fed-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.aggregator
          push: false
          tags: active-fed-aggregator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
